# AI Mind CI
# 触发：PR 到 main、push 到 main
# 权限：最小 contents: read
# 不：不登录生产镜像仓库、不推送镜像、不 SSH 部署、不注入生产 Secret

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stable-validation:
    name: Stable validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.34.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node and pnpm versions
        run: |
          node --version
          test "$(pnpm --version)" = "10.34.0"

      - name: Validate workspace boundaries
        run: pnpm validate:workspace-boundaries
      - name: Lint workspaces
        run: pnpm lint
      - name: Typecheck workspaces
        run: pnpm typecheck
      - name: Validate test lanes
        run: pnpm validate:test-lanes
      - name: Test stable lane
        run: pnpm test:stable
      - name: Build workspaces
        run: pnpm build

  stateful-integration:
    name: Stateful integration
    needs: stable-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_mind
          POSTGRES_PASSWORD: ai_mind
          POSTGRES_USER: ai_mind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_mind -d ai_mind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ai_mind:ai_mind@127.0.0.1:5432/ai_mind
      AI_MIND_AGENT_RUN_SESSION_SECRET: ci-agent-run-session-secret-at-least-32-chars
      AI_MIND_USER_MEMORY_EMBEDDING_DIMENSIONS: "1024"

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.34.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node and pnpm versions
        run: |
          node --version
          test "$(pnpm --version)" = "10.34.0"

      - name: Generate Prisma client
        run: pnpm --filter @ai-mind/database db:generate
      - name: Apply Prisma migrations
        run: pnpm --filter @ai-mind/database db:migrate:deploy
      - name: Set up runtime checkpoint tables
        run: pnpm --dir apps/webapp db:runtime-checkpoints:setup
      - name: Test integration lane
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:integration

  desktop-windows:
    name: Windows desktop verification
    needs: stable-validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.34.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies and capture install evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts/desktop | Out-Null
          $installLog = Join-Path (Get-Location) '.artifacts/desktop/pnpm-install.log'
          & pnpm install --frozen-lockfile *> $installLog
          $exitCode = $LASTEXITCODE
          Get-Content $installLog
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Verify Node and pnpm versions
        shell: pwsh
        run: |
          node --version
          if ((pnpm --version) -ne '10.34.0') { throw 'CI requires pnpm 10.34.0.' }

      - name: Verify clean-install build policy
        run: pnpm --dir apps/desktop exec node scripts/verify-pnpm-builds.mjs --platform win32-x64 --install-log .artifacts/desktop/pnpm-install.log --report .artifacts/desktop/pnpm-builds-win32-x64.json

      - name: Test desktop policies
        run: pnpm --filter @ai-mind/desktop test:stable
      - name: Test development Electron integration
        run: pnpm --filter @ai-mind/desktop test:integration
      - name: Make non-distributable Windows test package
        run: pnpm --filter @ai-mind/desktop make:windows
      - name: Verify package hash, fuses, and contents
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -Path apps/desktop/out/make -Recurse -File -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $artifact) { throw 'Windows make did not produce a Squirrel setup executable.' }

          $package = Get-ChildItem -Path apps/desktop/out -Directory | Where-Object { $_.Name -like '*win32-x64' } | Select-Object -First 1
          if (-not $package) { throw 'Windows make did not produce a win32-x64 package directory.' }

          $sourceCommit = git rev-parse HEAD
          $manifest = Join-Path $env:RUNNER_TEMP 'desktop-release.json'
          pnpm --dir apps/desktop exec node scripts/write-release-manifest.mjs --artifact $artifact.FullName --output $manifest --platform win32-x64 --source-commit $sourceCommit
          pnpm --dir apps/desktop exec node scripts/verify-release-artifact.mjs --app (Join-Path $package.FullName 'AI Mind Desktop.exe') --artifact $artifact.FullName --manifest $manifest --package-directory $package.FullName --platform win32-x64

  desktop-macos-arm64:
    name: macOS arm64 desktop verification
    needs: stable-validation
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Verify native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.34.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies and capture install evidence
        run: |
          set -o pipefail
          mkdir -p .artifacts/desktop
          pnpm install --frozen-lockfile 2>&1 | tee .artifacts/desktop/pnpm-install.log

      - name: Verify Node and pnpm versions
        run: |
          node --version
          test "$(pnpm --version)" = "10.34.0"

      - name: Verify clean-install build policy
        run: pnpm --dir apps/desktop exec node scripts/verify-pnpm-builds.mjs --platform darwin-arm64 --install-log .artifacts/desktop/pnpm-install.log --report .artifacts/desktop/pnpm-builds-darwin-arm64.json
      - name: Test desktop policies
        run: pnpm --filter @ai-mind/desktop test:stable
      - name: Test development Electron integration
        run: pnpm --filter @ai-mind/desktop test:integration
      - name: Make non-distributable macOS arm64 test package
        run: pnpm --filter @ai-mind/desktop make:macos-arm64
      - name: Verify DMG architecture, hash, fuses, and contents
        run: |
          artifact="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
          test -n "$artifact"
          package="$(find apps/desktop/out -maxdepth 1 -type d -name '*darwin-arm64' -print -quit)"
          test -n "$package"
          app="$package/AI Mind Desktop.app"
          executable="$app/Contents/MacOS/AI Mind Desktop"
          test -x "$executable"
          file "$executable" | grep -q 'arm64'
          ! file "$executable" | grep -qi 'universal'
          source_commit="$(git rev-parse HEAD)"
          manifest="$RUNNER_TEMP/desktop-release.json"
          pnpm --dir apps/desktop exec node scripts/write-release-manifest.mjs --artifact "$artifact" --output "$manifest" --platform darwin-arm64 --source-commit "$source_commit"
          pnpm --dir apps/desktop exec node scripts/verify-release-artifact.mjs --app "$executable" --artifact "$artifact" --manifest "$manifest" --package-directory "$package" --platform darwin-arm64

  docker:
    name: Docker build checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build postgres pgvector (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/postgres-pgvector.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=postgres-pgvector
          cache-to: type=gha,scope=postgres-pgvector,mode=max

      - name: Build webapp-runner (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: webapp-runner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,scope=webapp,mode=max

      - name: Build project-assistant-service-runner (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: project-assistant-service-runner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=pas
          cache-to: type=gha,scope=pas,mode=max
