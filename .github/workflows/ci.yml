# AI Mind CI
# 触发：PR 到 main、push 到 main
# 权限：最小 contents: read
# 不：不登录生产镜像仓库、不推送镜像、不 SSH 部署、不注入生产 Secret

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stable-validation:
    name: Stable validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node and pnpm versions
        run: |
          node --version
          test "$(pnpm --version)" = "10.34.0"

      - name: Validate workspace boundaries
        run: pnpm validate:workspace-boundaries
      - name: Lint workspaces
        run: pnpm lint
      - name: Typecheck workspaces
        run: pnpm typecheck
      - name: Validate test lanes
        run: pnpm validate:test-lanes
      - name: Test stable lane
        run: pnpm test:stable
      - name: Build workspaces
        run: pnpm build

  stateful-integration:
    name: Stateful integration
    needs: stable-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_mind
          POSTGRES_PASSWORD: ai_mind
          POSTGRES_USER: ai_mind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_mind -d ai_mind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ai_mind:ai_mind@127.0.0.1:5432/ai_mind
      AI_MIND_AGENT_RUN_SESSION_SECRET: ci-agent-run-session-secret-at-least-32-chars
      AI_MIND_USER_MEMORY_EMBEDDING_DIMENSIONS: "1024"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node and pnpm versions
        run: |
          node --version
          test "$(pnpm --version)" = "10.34.0"

      - name: Generate Prisma client
        run: pnpm --filter @ai-mind/database db:generate
      - name: Apply Prisma migrations
        run: pnpm --filter @ai-mind/database db:migrate:deploy
      - name: Set up runtime checkpoint tables
        run: pnpm --dir apps/webapp db:runtime-checkpoints:setup
      - name: Test integration lane
        run: pnpm test:integration

  docker:
    name: Docker build checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build postgres pgvector (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/postgres-pgvector.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=postgres-pgvector
          cache-to: type=gha,scope=postgres-pgvector,mode=max

      - name: Build webapp-runner (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: webapp-runner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,scope=webapp,mode=max

      - name: Build project-assistant-service-runner (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: project-assistant-service-runner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=pas
          cache-to: type=gha,scope=pas,mode=max
