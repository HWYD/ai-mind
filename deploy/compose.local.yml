name: ai-mind-local

services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres-pgvector.local.Dockerfile
    image: ai-mind-postgres-pgvector:local
    environment:
      POSTGRES_DB: ai_mind
      POSTGRES_PASSWORD: ai_mind
      POSTGRES_USER: ai_mind
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ai-mind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ai_mind -d ai_mind
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  project-assistant-service:
    build:
      context: ..
      dockerfile: Dockerfile
      target: project-assistant-service-runner
    env_file:
      - ./env/project-assistant-service.local.env
    environment:
      NODE_ENV: production
      PROJECT_ASSISTANT_SERVICE_HOST: 0.0.0.0
      PROJECT_ASSISTANT_SERVICE_PORT: "8788"
      TZ: Asia/Shanghai
    expose:
      - "8788"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8788/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  webapp-db-setup:
    build:
      context: ..
      dockerfile: Dockerfile
      target: webapp-runner
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./env/webapp.local.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ai_mind:ai_mind@postgres:5432/ai_mind
      TZ: Asia/Shanghai
    entrypoint: pnpm
    command:
      - --dir
      - /app
      - db:setup:deploy
    restart: "no"

  webapp:
    build:
      context: ..
      dockerfile: Dockerfile
      target: webapp-runner
    depends_on:
      postgres:
        condition: service_healthy
      webapp-db-setup:
        condition: service_completed_successfully
      project-assistant-service:
        condition: service_healthy
    env_file:
      - ./env/webapp.local.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://ai_mind:ai_mind@postgres:5432/ai_mind
      PROJECT_ASSISTANT_SERVICE_MCP_BASE_URL: http://project-assistant-service:8788/mcp
      AI_MIND_SESSION_COOKIE_SECURE: off
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # nginx-local 只在需要验证生产代理行为时启动，不作为默认开发依赖。
  # 启动方式：docker compose -f deploy/compose.local.yml --profile proxy up -d
  nginx-local:
    image: nginx:alpine
    profiles:
      - proxy
    depends_on:
      webapp:
        condition: service_healthy
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  ai-mind-postgres-data:
