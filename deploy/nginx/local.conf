# 本地 Nginx 代理配置，仅用于模拟生产反向代理行为。
# 通过 compose profile 启动：docker compose -f deploy/compose.local.yml --profile proxy up -d
# 不作为默认开发依赖；普通开发直接访问 http://localhost:3000。
#
# 未来接入 CDN 或多层代理时必须重新设计可信代理链：
#   本配置为单层 Nginx 代理，X-Forwarded-For 固定覆盖为 $remote_addr；
#   CDN 场景下需要基于 real_ip 模块信任上游代理段，并改为追加而非覆盖。

server {
    listen 80;
    server_name _;

    # PAS 是 Compose 内网私有服务，不通过 Nginx 暴露。
    location /mcp {
        return 404;
    }

    location / {
        proxy_pass http://webapp:3000;

        # 通用代理 Header：单层固定覆盖，不使用 $proxy_add_x_forwarded_for
        # 避免保留客户端伪造的首个值。
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 流式代理配置：关闭所有缓冲和缓存，保证 NDJSON chunk 逐帧到达。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        # 流式超时：模型响应和 SSE 长连接需要较长超时，本地 120s 覆盖绝大多数场景。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
